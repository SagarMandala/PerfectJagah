<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <nav class="navbar"><div class="nav-container"><div class="nav-logo"><i class="fas fa-gem"></i><span>Perfect Jagah</span></div><ul class="nav-menu"><li><a href="index.html#projects">Projects</a></li></ul><div class="nav-cta"><a href="tel:+919885588874" class="cta-btn-with-text"><i class="fas fa-phone"></i><span class="cta-text">+919885588874</span></a><a class="cta-btn" href="https://wa.me/919885588874"><i class="fab fa-whatsapp"></i></a></div></div></nav>
    <main class="container">
        <div class="project-hero project-section-card">
            <h1>SVG Flora</h1>
            <p>Jangaon, Warangal Highway, Telangana</p>
            <p><strong>Starting from &#8377;2,699 /- Per square yard</strong></p>
        </div>

        <div class="project-section-card">
            <h3>Key Highlights</h3>
            <div style="display:grid;gap:8px;margin-top:8px">
                <div style="display:flex;align-items:center;gap:8px;padding:12px;background:var(--bg-glass);border-radius:8px"><i class="fas fa-check-circle" style="color:#10b981"></i><span>3 mins from Warangal highway</span></div>
                <div style="display:flex;align-items:center;gap:8px;padding:12px;background:var(--bg-glass);border-radius:8px"><i class="fas fa-check-circle" style="color:#10b981"></i><span>5 mins from Jangoan District</span></div>
            </div>
        </div>

        <div class="project-section-card">
            <h3>Premium Amenities</h3>
            <div class="grid-amenities" id="amenitiesGrid"></div>
        </div>

        <div class="project-section-card">
            <h3>Gallery</h3>
            <div class="gallery-grid"><div class="gallery-item" onclick="openLightbox(0)"><img src="assets/images/project3/0.jpeg"></div></div>
        </div>

        <div class="actions"><a class="btn btn-primary" href="tel:+919885588874"><i class="fas fa-phone"></i> Call</a><a href="index.html" class="btn">Back</a></div>
    </main>
    <div class="lightbox" id="lightbox"><button class="lightbox-close" onclick="closeLightbox()">&times;</button><img id="lightboxImage"></div>
    <script>
        const amenities = [
            { icon: 'fas fa-file-contract', name: 'Grand Reception' },
            { icon: 'fas fa-road', name: 'Business center' },
            { icon: 'fas fa-shield-alt', name: 'Mega Club House' },
            { icon: 'fas fa-tint', name: 'Swimming Pool' },
            { icon: 'fas fa-water', name: 'Meditation Center' },
            { icon: 'fas fa-compass', name: 'Flower Garden' },
            { icon: 'fas fa-child', name: 'Internal Roads' },
            { icon: 'fas fa-bolt', name: 'Indoor & Outdoor Sports' },
            { icon: 'fas fa-lightbulb', name: 'Restaurant & Dining area' },
            { icon: 'fas fa-tree', name: 'Sandpit area' }
        ];
        const grid = document.getElementById('amenitiesGrid'); amenities.forEach(a => { const d = document.createElement('div'); d.className = 'amenity'; d.innerHTML = `<i class="${a.icon}"></i><div style="margin-top:8px">${a.name}</div>`; grid.appendChild(d); });
        const gallery = ['assets/images/project3/0.jpeg']; function openLightbox(i) { document.getElementById('lightboxImage').src = gallery[i]; document.getElementById('lightbox').classList.add('active'); document.body.style.overflow = 'hidden' } function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); document.getElementById('lightboxImage').src = ''; document.body.style.overflow = 'auto' }
    </script>
</body>
</html>
